[package]
name = "phone-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
phone-host.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ferroui-android.workspace = true
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-fonts-inter.workspace = true
phone-controls.workspace = true
phone-fonts.workspace = true
phone-native.workspace = true
