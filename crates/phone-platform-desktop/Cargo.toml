[package]
name = "phone-platform-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
phone-host = { path = "../phone-host" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc.workspace = true
