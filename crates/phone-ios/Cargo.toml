[package]
name = "phone-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
phone-host.workspace = true
serde_json.workspace = true
roxmltree = { workspace = true, optional = true }

[features]
# Compiles the real iOS 26 provider. Provisioning and user-selected default roles
# are checked independently at runtime; this feature grants no entitlement.
ios26-telephony = ["dep:roxmltree"]

[dev-dependencies]
roxmltree.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
phone-native.workspace = true
phone-fonts.workspace = true
phone-controls.workspace = true
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-fonts-inter.workspace = true
ferroui-ios = { workspace = true, features = ["skia"] }

[build-dependencies]
cc.workspace = true
