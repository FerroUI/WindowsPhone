name: Verify iOS host
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', 'NOTICE.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-mobile]') || contains(github.event.head_commit.message, '[verify-ios]')) && 'windows-phone-ios' || format('windows-phone-ios-skipped-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-mobile]') || contains(github.event.head_commit.message, '[verify-ios]')
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Read pinned toolchain
        id: pins
        run: |
          echo "rust=$(sed -n 's/^RUST_VERSION="\(.*\)"$/\1/p' FerroUI/scripts/browser/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "framework=$(git -C FerroUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD
          xcodebuild -version
      - name: Install pinned Rust and iOS standard library
        run: |
          rustup toolchain install '${{ steps.pins.outputs.rust }}' --profile minimal --target aarch64-apple-ios-sim
          echo 'RUSTUP_TOOLCHAIN=${{ steps.pins.outputs.rust }}' >> "$GITHUB_ENV"
      - name: Normalize framework source timestamps
        run: python3 scripts/ci-framework-mtimes.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: phone-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            phone-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}-
            phone-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-
      - name: Verify portable iOS completion contracts
        run: cargo test --locked -p phone-ios --lib
      - name: Build and bundle the UIKit application
        id: bundle
        run: |
          app="$(bash scripts/build-ios.sh --target aarch64-apple-ios-sim)"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Cache the successfully built UIKit application
        uses: actions/cache/save@v4
        if: always() && steps.bundle.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify simulator mounting and native activation
        timeout-minutes: 8
        run: bash scripts/smoke-ios.sh '${{ steps.bundle.outputs.app }}' "$RUNNER_TEMP/phone-ios-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: ${{ runner.temp }}/phone-ios-ui
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.bundle.outcome == 'success'
        with:
          name: phone-ios-simulator
          path: ${{ steps.bundle.outputs.app }}
          retention-days: 3
