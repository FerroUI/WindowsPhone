name: Attempt original Windows Phone emulator setup
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', 'NOTICE.md']
  workflow_dispatch:
    inputs:
      mode:
        description: Official Microsoft media to attempt on a fresh runner
        type: choice
        options: [web, offline-iso]
        default: web
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-original-emulator]') || contains(github.event.head_commit.message, '[verify-original-emulator-iso]')) && 'windows-phone-original-emulator' || format('windows-phone-original-emulator-skip-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  reference-setup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-original-emulator]') || contains(github.event.head_commit.message, '[verify-original-emulator-iso]')
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: 1
      ORIGINAL_EMULATOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || contains(github.event.head_commit.message, '[verify-original-emulator-iso]') && 'offline-iso' || 'web' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the experimental PowerShell entry point
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/attempt-original-emulator.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Attempt the signature-verified vendor setup without reboot
        timeout-minutes: 17
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'original-emulator-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          # The offline image is 986,316,800 bytes. Give its streamed download and
          # normal setup 15 minutes, plus one minute for probes and cleanup.
          $budgetSeconds = if ($env:ORIGINAL_EMULATOR_MODE -eq 'offline-iso') { 900 } else { 600 }
          $watchdogSeconds = $budgetSeconds + 60
          # An independent parent also bounds HTTP/signature calls, including
          # failures that prevent the child script from reaching its finally.
          $start = [Diagnostics.ProcessStartInfo]::new()
          $start.FileName = Join-Path $PSHOME 'pwsh.exe'
          $start.UseShellExecute = $false
          foreach ($argument in @('-NoProfile', '-NonInteractive', '-File',
              (Join-Path $PWD 'scripts/attempt-original-emulator.ps1'),
              '-OutputDirectory', $evidence, '-Mode', $env:ORIGINAL_EMULATOR_MODE,
              '-TimeoutSeconds', [string]$budgetSeconds)) {
            $start.ArgumentList.Add($argument)
          }
          $attempt = [Diagnostics.Process]::Start($start)
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $record = [ordered]@{ pid = $attempt.Id; mode = $env:ORIGINAL_EMULATOR_MODE; timeout_seconds = $watchdogSeconds; download_setup_budget_seconds = $budgetSeconds; timed_out = $false }
          $attemptExit = 1
          try {
            if (-not $attempt.WaitForExit($watchdogSeconds * 1000)) {
              $record.timed_out = $true
              throw "The complete reference-setup attempt exceeded $watchdogSeconds seconds."
            }
            $record.exit_code = $attempt.ExitCode
            $attemptExit = $attempt.ExitCode
          } finally {
            if (-not $attempt.HasExited) {
              $attempt.Kill($true)
              $record.owned_tree_stop_requested = $true
              $record.owned_root_exited = $attempt.WaitForExit(10000)
            }
            $record.elapsed_seconds = $watch.Elapsed.TotalSeconds
            $record | ConvertTo-Json | Set-Content (Join-Path $evidence 'watchdog.json') -Encoding utf8NoBOM
            $attempt.Dispose()
          }
          exit $attemptExit
      - name: Dismount the owned ISO and preserve a final probe after interruption
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'original-emulator-evidence'
          [void][IO.Directory]::CreateDirectory($evidence)
          $markerPath = Join-Path $evidence 'mounted-iso.json'
          $cleanup = [ordered]@{ marker_present = (Test-Path $markerPath); failed = $false }
          try {
            if ($cleanup.marker_present) {
              $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
              $ownedRoot = [IO.Path]::GetFullPath($marker.work_root)
              $ownedIso = [IO.Path]::GetFullPath($marker.image_path)
              # Do not eject unrelated mounted media, even after a killed child.
              if ([IO.Path]::GetFileName($ownedRoot) -notmatch '^phone-original-sdk-[0-9a-f]{32}$' -or
                  [IO.Path]::GetDirectoryName($ownedRoot).TrimEnd('\') -ine [IO.Path]::GetTempPath().TrimEnd('\') -or
                  $ownedIso -ine (Join-Path $ownedRoot 'windowsphone81sdkupdate1.iso')) {
                throw 'The retained ISO marker does not identify this attempt-owned temporary image.'
              }
              if (Test-Path -LiteralPath $ownedIso) {
                $disk = Get-DiskImage -ImagePath $ownedIso -ErrorAction Stop
                $cleanup.attached_before = $disk.Attached
                if ($disk.Attached) { Dismount-DiskImage -ImagePath $ownedIso -ErrorAction Stop }
                $cleanup.dismounted = -not (Get-DiskImage -ImagePath $ownedIso -ErrorAction Stop).Attached
                if (-not $cleanup.dismounted) { throw 'The owned ISO remained attached after cleanup.' }
              } else {
                $cleanup.temporary_image_already_removed = $true
              }
            }
          } catch {
            $cleanup.failed = $true
            $cleanup.error = $_.Exception.Message
            Write-Warning $_.Exception.Message
          } finally {
            $cleanup | ConvertTo-Json | Set-Content (Join-Path $evidence 'iso-cleanup.json') -Encoding utf8NoBOM
          }
          if (-not (Test-Path (Join-Path $evidence 'after.json'))) {
            python scripts/probe-original-emulator.py --json --timeout 20 `
              2> (Join-Path $evidence 'after-fallback-stderr.txt') |
              Set-Content (Join-Path $evidence 'after-fallback.json') -Encoding utf8NoBOM
          }
          if ($cleanup.failed) { exit 1 }
      - name: Retain reference setup observations and vendor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ORIGINAL_EMULATOR_MODE == 'offline-iso' && 'original-windows-phone-setup-iso' || 'original-windows-phone-setup' }}
          path: |
            ${{ runner.temp }}/original-emulator-evidence/*.json
            ${{ runner.temp }}/original-emulator-evidence/*.html
            ${{ runner.temp }}/original-emulator-evidence/*.txt
            ${{ runner.temp }}/original-emulator-evidence/logs/*.log
          if-no-files-found: warn
          retention-days: 3
