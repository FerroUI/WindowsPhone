name: Build and publish
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE', 'NOTICE.md']
  workflow_dispatch:
    inputs:
      verify_ui:
        description: Capture app screens and exercise desktop/touch interactions
        type: boolean
        default: false
      verify_native:
        description: Build Windows, macOS and Linux native adapters only (no Pages rebuild)
        type: boolean
        default: false
      reuse_run:
        description: Reverify and publish a matching compiled-app from a completed main run
        type: string
        default: ''
      publish:
        description: Publish the verified app to GitHub Pages
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: windows-phone-${{ contains(github.event.head_commit.message, '[mobile-only]') && 'mobile-check' || ((inputs.verify_native || contains(github.event.head_commit.message, '[native-only]')) && 'native-check' || 'pages') }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_BROWSER_CODEGEN_UNITS: 16
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  build:
    if: (github.event_name != 'workflow_dispatch' || !inputs.verify_native) && !contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[mobile-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FerroUI/src/Browser/FerroUI.Browser/webapp/package-lock.json
      - name: Validate compiled artifact reuse
        id: reuse
        env:
          PHONE_REUSE_RUN: ${{ inputs.reuse_run }}
          PHONE_REUSE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-reuse.mjs
      - name: Read framework tool pins
        if: steps.reuse.outputs.artifact_id == ''
        id: pins
        run: |
          echo "emsdk=$(sed -n 's/^EMSDK_VERSION="\(.*\)"$/\1/p' FerroUI/scripts/browser/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "rust=$(sed -n 's/^RUST_VERSION="\(.*\)"$/\1/p' FerroUI/scripts/browser/setup.sh)" >> "$GITHUB_OUTPUT"
          echo "bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' FerroUI/Cargo.toml)" >> "$GITHUB_OUTPUT"
          echo "framework=$(git -C FerroUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml', 'scripts/build-browser.sh', 'scripts/ci-framework-mtimes.py') }}-${CARGO_PROFILE_BROWSER_CODEGEN_UNITS}-${CARGO_PROFILE_TEST_DEBUG}-${CARGO_INCREMENTAL}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.reuse.outputs.artifact_id == ''
        id: tools
        with:
          path: |
            ~/browser-tools/emsdk
            ~/browser-tools/bin
          key: phone-tools-${{ runner.os }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.emsdk }}-${{ steps.pins.outputs.bindgen }}
      - name: Install pinned browser tools
        if: steps.reuse.outputs.artifact_id == ''
        run: |
          FerroUI/scripts/browser/setup.sh "$HOME/browser-tools"
          source "$HOME/browser-tools/env.sh"
          printf '%s\n' "EMSDK=$EMSDK" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "EMCC_CFLAGS=$EMCC_CFLAGS" >> "$GITHUB_ENV"
          printf '%s\n' "$EMSDK" "$EMSDK/upstream/emscripten" "$HOME/browser-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.reuse.outputs.artifact_id == '' && steps.tools.outputs.cache-hit != 'true'
        with:
          path: |
            ~/browser-tools/emsdk
            ~/browser-tools/bin
          key: phone-tools-${{ runner.os }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.emsdk }}-${{ steps.pins.outputs.bindgen }}
      - name: Normalize pinned framework timestamps
        if: steps.reuse.outputs.artifact_id == ''
        run: python3 scripts/ci-framework-mtimes.py
      # Keep FerroUI path dependencies: rust-cache prunes nonmember crates below
      # the workspace root. The SHA suffix lets each successful build refresh
      # the cache while the prefix preserves framework/configuration boundaries.
      - uses: actions/cache/restore@v4
        if: steps.reuse.outputs.artifact_id == ''
        id: build-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: phone-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-${{ steps.pins.outputs.build }}-${{ github.sha }}
          restore-keys: |
            phone-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-${{ steps.pins.outputs.build }}-
            phone-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.rust }}-${{ steps.pins.outputs.framework }}-
      - name: Verify state
        if: steps.reuse.outputs.artifact_id == ''
        run: cargo test --locked -p phone-host -p phone-domain -p phone-state
      - name: Verify SDK and game contracts
        if: inputs.verify_ui || contains(github.event.head_commit.message, '[verify-ui]')
        run: cargo test --locked -p phone-runtime -p phone-app-device -p phone-app-phone -p phone-app-messaging -p phone-app-outlook -p phone-app-people -p phone-app-settings -p phone-alarm-service -p phone-system -p phone-sdk -p phone-controls -p phone-app-support -p phone-media-support -p phone-app-photos -p phone-app-cortana -p phone-app-tic-tac-toe -p phone-app-minesweeper -p phone-app-onenote -p phone-app-weather -p phone-app-podcasts -p phone-app-wallet -p phone-app-maps -p phone-office-support -p phone-app-sdk-example
      - name: Verify host boundaries
        run: node --test scripts/*.test.mjs
      - name: Build Windows Phone
        if: steps.reuse.outputs.artifact_id == ''
        run: bash scripts/build-browser.sh
      - name: Save compiled framework and app
        uses: actions/cache/save@v4
        if: steps.reuse.outputs.artifact_id == '' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        if: steps.reuse.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          merge-multiple: true
          path: target/browser/phone-browser
          repository: ${{ github.repository }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify reused module links
        if: steps.reuse.outputs.artifact_id != ''
        run: node --experimental-vm-modules scripts/verify-site.mjs target/browser/phone-browser
      - name: Verify first frame
        if: ${{ steps.reuse.outputs.artifact_id == '' && !inputs.verify_ui && !contains(github.event.head_commit.message, '[verify-ui]') }}
        timeout-minutes: 2
        run: node scripts/startup-smoke.mjs target/browser/phone-browser
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.artifact_id != '' || inputs.verify_ui || contains(github.event.head_commit.message, '[verify-ui]')
        with:
          name: compiled-app
          path: target/browser/phone-browser
          retention-days: 3
      - name: Verify rendered desktop and touch views
        if: steps.reuse.outputs.artifact_id != '' || inputs.verify_ui || contains(github.event.head_commit.message, '[verify-ui]')
        timeout-minutes: 7
        run: node scripts/ui-smoke.mjs target/browser/phone-browser target/ui-smoke
      - uses: actions/upload-artifact@v4
        if: always() && (steps.reuse.outputs.artifact_id != '' || inputs.verify_ui || contains(github.event.head_commit.message, '[verify-ui]'))
        with:
          name: ui-verification
          path: target/ui-smoke
          if-no-files-found: ignore
          retention-days: 5
      - uses: actions/configure-pages@v5
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        with:
          path: target/browser/phone-browser
  deploy:
    needs: build
    if: (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[native-only]') && !contains(github.event.head_commit.message, '[mobile-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  native:
    if: "!contains(github.event.head_commit.message, '[mobile-only]') && ((github.event_name == 'workflow_dispatch' && inputs.verify_native) || contains(github.event.head_commit.message, '[verify-native]') || contains(github.event.head_commit.message, '[native-only]'))"
    strategy:
      fail-fast: false
      matrix:
        # The pinned ANGLE/bindgen dependency needs a compatible MSVC/LLVM pair.
        os: [windows-2022, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 256
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Verify Windows compiler and standard library compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$env:LIBCLANG_PATH\libclang.dll")) {
            throw 'The pinned Windows runner must provide LLVM/libclang.'
          }
          & "$env:LIBCLANG_PATH\clang.exe" --version
          '#include <string>' | & "$env:LIBCLANG_PATH\clang.exe" --target=x86_64-pc-windows-msvc -x c++ -std=c++17 -fsyntax-only -
          if ($LASTEXITCODE -ne 0) { throw 'MSVC headers and LLVM are incompatible.' }
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" >> $env:GITHUB_ENV
      - name: Install the pinned Rust toolchain
        run: |
          PHONE_NATIVE_RUST=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$PHONE_NATIVE_RUST" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$PHONE_NATIVE_RUST" >> "$GITHUB_ENV"
          echo "PHONE_NATIVE_FRAMEWORK=$(git -C FerroUI rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Normalize pinned framework timestamps
        run: python scripts/ci-framework-mtimes.py
      - name: Install Linux media development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype-dev libegl-dev libgles-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev libpipewire-0.3-dev
      - uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: phone-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.PHONE_NATIVE_FRAMEWORK }}-${{ runner.os == 'Windows' && format('{0}-', matrix.os) || '' }}${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            phone-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.PHONE_NATIVE_FRAMEWORK }}-${{ runner.os == 'Windows' && format('{0}-', matrix.os) || '' }}
      - name: Verify portable host boundaries
        run: cargo test --locked -p phone-host -p phone-platform-desktop
      - name: Verify session packaging boundaries
        run: python -B -m unittest discover -s crates/phone-desktop/platform/tests -v
      - name: Parse Windows shell configuration helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'crates/phone-desktop/platform/windows/ShellLauncher.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Inspect original Windows Phone emulator prerequisites
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python scripts/probe-original-emulator.py --json > original-emulator-windows.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: original-emulator-windows-host
          path: original-emulator-windows.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify Linux media-session protocol
        if: runner.os == 'Linux'
        run: dbus-run-session -- env PHONE_MPRIS_TEST_SESSION=1 cargo test --locked -p phone-host private_bus_media_controls -- --ignored
      - name: Verify shared native services
        run: cargo test --locked -p phone-native --lib
      - name: Build and link the complete native host
        run: cargo build --locked -p phone-desktop
